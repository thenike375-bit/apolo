<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PostFactum Desktop</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f1115;
        color: #f4f4f5;
      }
      main {
        width: min(32rem, calc(100vw - 2rem));
        background: #171a21;
        border: 1px solid #2a2f3a;
        border-radius: 16px;
        padding: 1.75rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.35rem;
      }
      p {
        margin: 0 0 1rem;
        color: #a1a1aa;
        line-height: 1.5;
      }
      label {
        display: block;
        font-size: 0.85rem;
        margin-bottom: 0.4rem;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #3f4654;
        background: #0f1115;
        color: inherit;
        border-radius: 8px;
        padding: 0.7rem 0.8rem;
        font: inherit;
      }
      .actions {
        display: flex;
        gap: 0.6rem;
        margin-top: 1rem;
      }
      button {
        border: 0;
        border-radius: 8px;
        padding: 0.65rem 0.9rem;
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        background: #f59e0b;
        color: #111827;
        font-weight: 600;
      }
      button.ghost {
        background: transparent;
        color: #e4e4e7;
        border: 1px solid #3f4654;
      }
      .error {
        color: #fca5a5;
        min-height: 1.25rem;
        margin: 0.6rem 0 0;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body data-postfactum-setup="true">
    <main>
      <h1>Open PostFactum</h1>
      <p>
        The desktop app loads the full website (chat, live lessons, films, and
        APIs). Start the web app locally, or paste a deployed PostFactum URL.
      </p>
      <form id="form">
        <label for="url">Website URL</label>
        <input
          id="url"
          name="url"
          type="url"
          required
          placeholder="http://127.0.0.1:8080"
        />
        <p class="error" id="error"></p>
        <div class="actions">
          <button class="primary" type="submit">Open site</button>
          <button class="ghost" type="button" id="retry">Retry current URL</button>
        </div>
      </form>
    </main>
  </body>
</html>
